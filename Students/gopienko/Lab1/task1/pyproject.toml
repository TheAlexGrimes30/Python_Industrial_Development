[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-board-lab"
version = "0.1.0"
description = "Training task board"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<0.31",
    "task-web==0.1.0",
    "task-workflow==0.1.0",
    "task-notifier==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
task-web = { workspace = true }
task-workflow = { workspace = true }
task-notifier = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
